name: week7-spark

services:
  spark-master:
    image: apache/spark:3.5.7-python3
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    environment:
      SPARK_DAEMON_MEMORY: 512m
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./jobs:/opt/spark/jobs:ro
      - ./data:/opt/spark/data:ro
    mem_limit: 2g
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read()"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.7-python3
    hostname: spark-worker
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --host
      - spark-worker
      - --cores
      - "2"
      - --memory
      - 2g
      - --webui-port
      - "8081"
      - --work-dir
      - /tmp/spark-work
      - spark://spark-master:7077
    environment:
      SPARK_DAEMON_MEMORY: 512m
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
    ports:
      - "127.0.0.1:8082:8081"
    volumes:
      - ./jobs:/opt/spark/jobs:ro
      - ./data:/opt/spark/data:ro
    mem_limit: 3g
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8081/', timeout=5).read()"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    restart: unless-stopped
